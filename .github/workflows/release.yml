# Publishes a release whenever a version tag is pushed:
#
#   1. bump `version` in Cargo.toml (e.g. 0.0.2) and commit
#   2. git tag v0.0.2 && git push origin main v0.0.2
#
# The MSVC build links the C runtime and the WebView2 loader statically, so the
# exe needs nothing installed. The release carries RustWinUtil-windows-x64.zip:
# the program folder plus a manifest of every file's SHA-256. The workflow also
# writes update.json to the `updates` branch, which is how the Javacrafter
# Launcher finds and verifies RustWinUtil updates. The launcher shows them; it
# never installs one by itself.

name: Release

on:
  push:
    tags: ['v*']

# One release at a time, so two tags pushed together can't race on update.json.
concurrency: release

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches Cargo.toml
        id: version
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          $ver = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ($tag -ne $ver) { throw "Tag v$tag doesn't match Cargo.toml version $ver" }
          "version=$ver" >> $env:GITHUB_OUTPUT

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      # The exe carries WinUtil's config, which is MIT-licensed: its license
      # travels with every copy, alongside RustWinUtil's own.
      - name: Assemble the folder
        shell: pwsh
        run: |
          $dir = 'dist/RustWinUtil'
          New-Item -ItemType Directory -Force "$dir/licenses" | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/RustWinUtil.exe $dir
          Copy-Item LICENSE-MIT, LICENSE-APACHE "$dir/licenses/"
          Copy-Item winutil/LICENSE "$dir/licenses/WinUtil-LICENSE.txt"

      - name: Package
        shell: pwsh
        run: ./tools/release-package.ps1 -Folder dist/RustWinUtil -Name RustWinUtil -Exe RustWinUtil.exe -Version ${{ steps.version.outputs.version }} -Out release

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $pre = if ($tag -match '-') { '--prerelease' } else { $null }
          gh release create $tag release/RustWinUtil-windows-x64.zip `
            --title "RustWinUtil $($tag.TrimStart('v'))" --generate-notes $pre

      # update.json lives on its own `updates` branch so releases never add commits
      # to main. The launcher reads it from raw.githubusercontent.com.
      - name: Publish update.json
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag  = '${{ github.ref_name }}'
          $repo = '${{ github.repository }}'
          $info = gh release view $tag --json body,isPrerelease | ConvertFrom-Json
          # Read raw: ConvertFrom-Json would turn the timestamp into a local-format date.
          $published = gh release view $tag --json publishedAt --jq .publishedAt

          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if (git ls-remote --heads origin updates) {
            git fetch --depth 1 origin updates
            git worktree add updates-branch FETCH_HEAD
          } else {
            # First release with update.json: start the branch with nothing else on it.
            git worktree add --detach updates-branch
            git -C updates-branch checkout --orphan updates
            git -C updates-branch rm -rf --quiet .
          }

          ./tools/publish-update.ps1 -Entry release/release-entry.json -Repo $repo -Tag $tag `
            -UpdateJson updates-branch/update.json -Prerelease:$info.isPrerelease `
            -Notes "$($info.body)" -Published $published

          git -C updates-branch add update.json
          git -C updates-branch commit -m "update.json for $tag"
          git -C updates-branch push origin HEAD:refs/heads/updates

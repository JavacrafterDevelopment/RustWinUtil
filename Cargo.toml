[package]
name = "rustwinutil"
version = "0.0.1"
edition = "2021"
description = "A portable Rust take on Chris Titus Tech's WinUtil: install apps, apply tweaks, fix Windows."
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "RustWinUtil"
path = "src/main.rs"

[dependencies]
tao = "0.37"
wry = "0.57"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
